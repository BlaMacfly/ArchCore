[workspace]
resolver = "2"
members = ["crates/archcore-net", "crates/archcore"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["BlaMacfly"]
repository = "https://github.com/BlaMacfly/ArchCore"

[workspace.dependencies]
archcore-net = { path = "crates/archcore-net" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
async-trait = "0.1"
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
md-5 = "0.10"
sha2 = "0.10"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
