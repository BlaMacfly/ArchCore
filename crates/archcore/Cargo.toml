[package]
name = "archcore"
description = "ArchCore : émulateur de serveur ArchLord (login + monde) en Rust, sur MariaDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "archcore"
path = "src/main.rs"

[features]
# ArchBot : bots autonomes et compagnons (module dans modules/ArchBot, voir son README). Retirer la feature des
# défauts, ou construire avec --no-default-features, pour un serveur sans bots.
default = ["archbot"]
archbot = ["dep:archbot"]

[dependencies]
archcore-net.workspace = true
# Moteur d'ArchBot (dépôt BlaMacfly/ArchBot cloné dans modules/ArchBot).
archbot = { path = "../../modules/ArchBot", optional = true }
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
mysql_async.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
sha2.workspace = true
chrono.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
encoding_rs.workspace = true
